name: Auto-Promote review → master

# Why this workflow:
#   Per TRDD-bbd4b1f0, review → master is the one promotion that is
#   NOT fully automatic — it requires a designated approver (human or
#   an AI-review bot) to sign off before stable release. This workflow
#   wires that human-in-the-loop step into the automation:
#
#     1. On every push to `review`, ensure there's an open PR
#        `review → master` pointing at the latest commit. The
#        developer never needs to open this PR manually.
#     2. When a `pull_request_review` is submitted with state
#        `approved` AND the reviewer's login is in the
#        `APPROVERS_ALLOWLIST` repository variable, re-verify CI on
#        the SHA and fast-forward-merge review into master.
#     3. `workflow_dispatch` is the manual escape hatch (also useful
#        for bootstrapping the first release before the workflow has
#        propagated to `main`).
#
# Approver allowlist:
#   `APPROVERS_ALLOWLIST` is a comma-separated GitHub-Actions
#   repository variable containing the GitHub usernames (or bot
#   logins, e.g. `claude[bot]`) authorised to approve stable releases.
#   Configure via:
#     gh variable set APPROVERS_ALLOWLIST -b 'Emasoft,claude[bot]'
#   If the variable is empty/unset, NO approver can pass the gate
#   (fail-closed).
#
# Defense in depth:
#   release-dry-run.yml already gated the SHA into review, but an
#   interim push to review may have introduced drift. We re-list CI
#   runs on the approved SHA and require all to be success/skipped
#   before merging — same gate as auto-promote-testing-to-review.

on:
  push:
    branches: [review]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "The SHA on review being approved (40-char)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

concurrency:
  group: auto-promote-review-to-stable
  cancel-in-progress: false

jobs:
  # Job 1 — fires on push: keep an open PR review → master that
  # reflects the latest review HEAD. The developer never opens this
  # manually.
  ensure-open-pr:
    name: Ensure open PR review → master
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Open or update PR review → master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Look for an existing open PR with head=review and base=master.
          existing=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --base master \
            --head review \
            --json number,headRefOid \
            --jq '.[0].number // empty')

          if [[ -z "$existing" ]]; then
            # printf doesn't process `\\` `; keep the body in single
            # quotes (backticks survive) and embed real newlines via $'...'.
            body=$'Auto-generated by `auto-promote-review-to-stable.yml`. Approval by an allowlisted reviewer (see APPROVERS_ALLOWLIST repo variable) merges review → master and triggers the stable release.\n\nSee design/tasks/TRDD-bbd4b1f0-*.md for the full pipeline.'
            gh pr create \
              --repo "$REPO" \
              --base master \
              --head review \
              --title "auto: review → master (awaiting approval)" \
              --body "$body"
            echo "Opened new PR review → master."
          else
            echo "Existing open PR #$existing already tracks review — nothing to do."
          fi

  # Job 2 — fires on pull_request_review (approved + allowlisted) or
  # workflow_dispatch: re-verify CI green and merge review → master.
  approve-and-merge:
    name: Verify approver and merge review → master
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'master' &&
       github.event.pull_request.head.ref == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Verify reviewer is in APPROVERS_ALLOWLIST
        if: github.event_name == 'pull_request_review'
        env:
          ALLOWLIST: ${{ vars.APPROVERS_ALLOWLIST }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          set -euo pipefail
          if [[ -z "$ALLOWLIST" ]]; then
            echo "::error::APPROVERS_ALLOWLIST repository variable is empty/unset — refusing to merge."
            echo "Set it with: gh variable set APPROVERS_ALLOWLIST -b 'user1,user2'"
            exit 1
          fi
          # Comma-separated, trim whitespace, exact match (case-sensitive
          # to match GitHub's login semantics).
          ok=0
          IFS=',' read -ra approvers <<< "$ALLOWLIST"
          for a in "${approvers[@]}"; do
            a_trim="${a// /}"
            if [[ "$REVIEWER" == "$a_trim" ]]; then
              ok=1
              break
            fi
          done
          if (( ok == 0 )); then
            echo "::error::Reviewer '$REVIEWER' is not in APPROVERS_ALLOWLIST. Allowed: $ALLOWLIST"
            exit 1
          fi
          echo "Reviewer '$REVIEWER' is on the allowlist — proceeding."

      - name: Checkout (full history needed for the merge)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity (github-actions[bot])
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve approved SHA and verify it lives on review
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            sha="${{ github.event.pull_request.head.sha }}"
          else
            sha="${{ github.event.inputs.approved_sha }}"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid SHA: $sha (expected 40-char hex)"
            exit 1
          fi
          # Refuse to merge a SHA that isn't actually on review.
          git fetch origin review
          if ! git merge-base --is-ancestor "$sha" origin/review; then
            echo "::error::SHA $sha is not on origin/review — refusing to merge."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Approved SHA $sha verified on review."

      - name: Idempotency check (master may already contain this SHA)
        id: idempotent
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          if git merge-base --is-ancestor "$SHA" origin/master; then
            echo "master already contains $SHA — nothing to promote."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-verify CI green on approved SHA (defense in depth)
        if: steps.idempotent.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          runs_json=$(gh run list \
            --commit "$SHA" \
            --json conclusion,status,name,workflowName,url \
            --limit 200)

          inflight=$(echo "$runs_json" | jq '[.[] | select(.status != "completed")] | length')
          failed_runs=$(echo "$runs_json" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped")]')
          failed_count=$(echo "$failed_runs" | jq 'length')

          if (( inflight > 0 )); then
            echo "::error::$inflight CI run(s) still in-flight on $SHA. Wait for them, then re-approve."
            exit 1
          fi
          if (( failed_count > 0 )); then
            echo "::error::CI is red on $SHA — refusing to promote even with approval."
            echo "$failed_runs" | jq -r '.[] | "  - \(.workflowName) [\(.conclusion)] \(.url)"'
            exit 1
          fi
          echo "All completed CI runs on $SHA are success/skipped."

      - name: Merge review → master and push
        if: steps.idempotent.outputs.skip == 'false'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          REVIEWER: ${{ github.event.review.user.login || github.actor }}
        run: |
          set -euo pipefail
          git checkout master
          git merge --no-ff "$SHA" -m "auto: review → master (approved by $REVIEWER at $SHA)"

          i=0
          until git -c http.lowSpeedLimit=100 -c http.lowSpeedTime=300 push origin master; do
            i=$((i+1))
            if (( i >= 10 )); then
              echo "::error::Push to origin/master failed after 10 retries"
              exit 1
            fi
            sleep 6
          done
          echo "::notice::Promoted review → master at $SHA (approved by $REVIEWER)"

  notify-failure:
    name: Notify (sticky issue)
    needs: approve-and-merge
    if: failure()
    uses: ./.github/workflows/pipeline-failure-notifier.yml
    permissions:
      issues: write
      contents: read
    with:
      stage: review-to-stable
      sha: ${{ needs.approve-and-merge.outputs.sha || 'unknown' }}
      summary: "auto-promote review → master failed — see the run log for details (likely: missing approver, CI not green, or push refused)"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
