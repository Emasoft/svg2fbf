name: Auto-Publish Stable (master → PyPI + GitHub Release)

# Why this workflow:
#   Master is the publish branch — pushes to it are expected to come
#   ONLY from `auto-promote-review-to-stable.yml`'s merge step (i.e.
#   the github-actions[bot] account). When that happens, this workflow
#   runs `scripts/release.sh --stable master --from-ci` to:
#     - bump version (uv version --bump)
#     - regenerate CHANGELOG via git-cliff
#     - build wheel + sdist
#     - tag, create GitHub release, upload artifacts
#     - publish to PyPI via uv publish (trusted publisher / OIDC)
#     - sync `main` to match `master` so the mirror branch never drifts
#
# Bot-only push enforcement:
#   The first step verifies the HEAD commit author is the GitHub
#   Actions bot. A direct human push to master (in a world where
#   branch protection has been bypassed) would refuse to publish —
#   defensive belt-and-suspenders against accidental escalation.
#
# Secrets / OIDC:
#   PyPI publishing relies on either:
#     - `PYPI_API_TOKEN` repository secret (legacy), OR
#     - PyPI Trusted Publishing via OIDC (id-token: write).
#   `release.sh` already uses whichever is configured for `uv publish`.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      no_pypi:
        description: "Build the GitHub release but skip the PyPI publish step (use to dry-run the release flow)"
        required: false
        default: "false"
        type: string

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: auto-publish-stable
  cancel-in-progress: false

jobs:
  # Hard gate: refuse to publish to PyPI unless the cross-platform
  # wheel install passed on master@HEAD across the full
  # {linux, macos, windows} × {3.11, 3.12, 3.13} matrix.
  #
  # The Cross-Platform Verify workflow fires in parallel on the same
  # push event, so this job polls `gh run list --commit` and waits
  # for it to finish before letting `publish` proceed. Without this
  # gate, a regression in compiled deps (numpy / uharfbuzz) on a
  # single platform/Python combo could ship to PyPI and break end
  # users on first install.
  wait-for-cross-platform:
    name: Wait for Cross-Platform Verify on master@HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip when explicitly invoked via workflow_dispatch with no_pypi=true
    # (the "dry-run the release flow" path) — that's the operator opting
    # out and they accept the lower bar.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.no_pypi != 'true'
    steps:
      - name: Poll for Cross-Platform Verify result
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$(($(date +%s) + 1800))   # 30 min hard cap
          interval=20                         # poll every 20s

          echo "Waiting for 'Cross-Platform Verify' to complete on $SHA..."
          while true; do
            # `gh run list --workflow` accepts the workflow name (the
            # `name:` field at the top of the .yml). Limit=5 in case
            # of retries; we always pick the most recent.
            run_json=$(gh run list \
              --repo "$REPO" \
              --commit "$SHA" \
              --workflow "Cross-Platform Verify" \
              --json status,conclusion,databaseId,url \
              --limit 5 \
              --jq '[.[]] | sort_by(.databaseId) | reverse | .[0] // {}')
            status=$(echo "$run_json" | jq -r '.status // empty')
            conclusion=$(echo "$run_json" | jq -r '.conclusion // empty')
            url=$(echo "$run_json" | jq -r '.url // empty')

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "::notice::Cross-Platform Verify passed on $SHA."
                echo "  run: $url"
                exit 0
              else
                echo "::error::Cross-Platform Verify completed with conclusion='$conclusion' on $SHA."
                echo "::error::Refusing to publish — fix the platform-specific failure first."
                echo "::error::Run log: $url"
                exit 1
              fi
            fi

            now=$(date +%s)
            if (( now > deadline )); then
              echo "::error::Timed out waiting for Cross-Platform Verify on $SHA after 30 minutes."
              echo "::error::Refusing to publish."
              exit 1
            fi

            if [[ -z "$status" ]]; then
              echo "  Cross-Platform Verify run not yet enqueued for $SHA. Waiting..."
            else
              echo "  status=$status (waiting ${interval}s)"
            fi
            sleep "$interval"
          done

  publish:
    name: Run release.sh --stable master --from-ci
    needs: wait-for-cross-platform
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout master with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Resolve master@HEAD SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify HEAD commit was authored by github-actions[bot]
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # Inspect the HEAD commit's author + committer email.
          # The promotion workflows use 41898282+github-actions[bot]@…
          author_email=$(git log -1 --pretty='%ae')
          committer_email=$(git log -1 --pretty='%ce')
          author_name=$(git log -1 --pretty='%an')
          echo "Author email:    $author_email"
          echo "Committer email: $committer_email"
          echo "Author name:     $author_name"

          bot_email='41898282+github-actions[bot]@users.noreply.github.com'
          bot_name='github-actions[bot]'

          if [[ "$author_email" != "$bot_email" && "$committer_email" != "$bot_email" \
             && "$author_name" != "$bot_name" ]]; then
            echo "::error::HEAD commit on master was not authored by github-actions[bot]."
            echo "::error::Direct human pushes to master are not authorized to publish."
            echo "::error::Use the auto-promote-review-to-stable workflow with an approved PR."
            exit 1
          fi

      - name: Configure git identity (github-actions[bot])
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v5.2.2

      - name: Install Python via uv
        run: uv python install 3.12

      - name: Sync project (build + dev deps)
        run: uv sync --all-extras --dev

      - name: Add venv bin to PATH so release.sh's `git cliff` resolves
        # release.sh invokes `git cliff` to regenerate CHANGELOG.md.
        # `git cliff` works as a git subcommand only if the
        # `git-cliff` binary is on PATH. `uv sync --dev` puts it
        # under .venv/bin/, so we prepend that to PATH for the rest
        # of the job.
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Run release.sh --stable master --from-ci
        env:
          # Standard token for gh CLI (creates GitHub release, uploads).
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # PyPI publish token (legacy — used by uv publish if no OIDC).
          # The script falls back to OIDC trusted publishing when this
          # is unset and `id-token: write` is granted (which it is
          # above), so this secret is *optional* in modern setups.
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.no_pypi }}" == "true" ]]; then
            ./scripts/release.sh --stable master --from-ci --no-pypi
          else
            ./scripts/release.sh --stable master --from-ci
          fi

  notify-failure:
    name: Notify (sticky issue)
    needs: publish
    if: failure()
    uses: ./.github/workflows/pipeline-failure-notifier.yml
    permissions:
      issues: write
      contents: read
    with:
      stage: publish-stable
      sha: ${{ needs.publish.outputs.sha || 'unknown' }}
      summary: "auto-publish-stable failed — release.sh did not complete cleanly. Check the run log; PyPI publish may have partially succeeded (verify on pypi.org)."
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
